<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, user-scalable=no">
<title>BH Screen</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="home">
<div id="home" data-page="start">
  <aside id="side"><div class="brand">Biskup Home</div><div class="side-item" data-page="start"><svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg><span>Home</span></div><div class="side-item" data-page="radio"><svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v11h16V9zM4 9l13-5M8 15h.01M13 13h4M13 16h4"/></svg><span>Radio</span></div><div class="side-item" data-page="mood"><svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 1-3 0-6 1-9z"/></svg><span>Stimmung</span></div></aside>
  <div id="stage">
  <div id="side-hint" aria-hidden="true"><svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></div>
  <svg class="hills" viewBox="0 0 1920 1080" preserveAspectRatio="none" aria-hidden="true"><path fill="#f8ecd9" d="M0 500 C 380 440 820 560 1220 490 S 1720 440 1920 490 V1080 H0Z"/><path fill="#f1dfc2" d="M0 720 C 500 680 930 750 1410 705 S 1790 690 1920 715 V1080 H0Z"/></svg>
  <div id="wxbg" aria-hidden="true"></div>
  <header class="top">
    <div><div id="clock">--:--</div><div id="date"></div></div>
    <div class="weather"><div id="temp"></div><div id="sky"></div></div>
  </header>
  <section id="playing">
    <div id="radio"><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span></div>
    <div class="now"><div id="station"></div><div id="note"></div></div>
  </section>
  <section id="today"></section>
  <section id="alerts"></section>
  <section id="transit"></section>
  <section id="grid-radio" class="grid"></section>
  <section id="grid-mood" class="grid"></section>
  </div>
</div>
<main id="screen"><h1 id="title"></h1><p id="text"></p></main>
<audio id="player" preload="none"></audio>
<video id="share" autoplay playsinline></video>
<div id="ambient"><iframe id="player-frame" allow="autoplay; encrypted-media" tabindex="-1"></iframe><div id="vbar"></div></div>
<script src="config.js"></script>
<script src="home.js"></script>
<script src="main.js"></script>
</body>
</html>
