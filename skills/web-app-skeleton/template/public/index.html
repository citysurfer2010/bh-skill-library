<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}} · BH Platform</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="mark">BH</span><span>{{TITLE}}</span></div>
    <div class="user" id="user" aria-live="polite"></div>
  </header>
  <main class="page">
    <h1>{{TITLE}}</h1>
    <form id="add" class="card row" hidden>
      <label class="grow">Neuer Eintrag<input id="title" maxlength="200" required></label>
      <button type="submit">Hinzufuegen</button>
    </form>
    <section class="card">
      <h2>Eintraege</h2>
      <p id="status" role="status">Wird geladen …</p>
      <ul id="items" class="list"></ul>
    </section>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
