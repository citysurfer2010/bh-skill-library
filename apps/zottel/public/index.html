<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Zottel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="/zottel/favicon.svg?v=3">
  <link rel="apple-touch-icon" href="/zottel/branding/apple-touch-icon.png?v=3">
  <link rel="manifest" href="/zottel/manifest.webmanifest">
  <meta name="theme-color" content="#1d4ed8">
  <!-- Set the theme before the stylesheets, otherwise the page flashes white. -->
  <script>(function(){var s;try{s=localStorage.getItem('bh-theme');}catch(e){}var d=window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.dataset.theme=s||(d?'dark':'light');})();</script>
  <!-- No style= attributes: helper classes in css/utilities.css or a dedicated class in css/*.css. -->
  <link rel="stylesheet" href="/zottel/bh-styles.css">
  <link rel="stylesheet" href="/zottel/app.css">
</head>
<body>
  <!-- Navbar.render() builds the frame around #page-host. Every page draws its own page header. -->
  <div id="page-host"></div>

  <script>window.APP_BASE = "/zottel";</script>
  <!-- All components as one bundle: 1 request instead of N. -->
  <script src="/zottel/app.js"></script>
  <script src="/zottel/build-version-check.js"></script>
  <script src="/zottel/components/pages/home-page.js"></script>
</body>
</html>
