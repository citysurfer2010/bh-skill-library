<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Apps · BH Platform</title>
<style>
:root { --bg: #f1f5fd; --surface: #fff; --text: #0f1f3d; --muted: #566583; --border: #d6e0f2; --primary: #1d4ed8; --on: #fff; }
@media (prefers-color-scheme: dark) { :root { --bg: #0b1730; --surface: #12233f; --text: #e6eefc; --muted: #9fb2d1; --border: #27406a; --primary: #60a5fa; --on: #0b1730; } }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, sans-serif; }
main { max-width: 400px; width: 100%; box-sizing: border-box; padding: 24px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }
.mark { display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: 9px; background: var(--primary); color: var(--on); font-size: 14px; font-weight: 700; }
h1 { font-size: 24px; margin: 16px 0 4px; } p { margin: 0; color: var(--muted); }
</style></head>
<body><main><span class="mark" aria-hidden="true">BH</span><h1>Apps</h1><p>Hier erscheinen die Apps der BH Platform, sobald sie eingerichtet sind.</p></main></body>
</html>
